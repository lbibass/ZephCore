# SPDX-License-Identifier: Apache-2.0
# BQ Station G2 — ZephCore board configuration
#
# Hardware:
#   ESP32-S3 (16MB flash, 8MB PSRAM)
#   SX1262 + PA on SPI2 (TX power 7 dBm → ~27 dBm with PA)
#   SH1106 128x64 OLED on I2C0
#   GPS on UART1
#   User button on GPIO38
#
# Include order: prj.conf → zephcore_common.conf → esp32_common.conf → board.conf

# Board identification
CONFIG_ZEPHCORE_BOARD_NAME="Heltec V3"
CONFIG_BT_DIS_MODEL_NUMBER_STR="heltec_wifi_lora32_v3"


# CONFIG_ZEPHCORE_DEFAULT_TX_POWER_DBM=22
# CONFIG_ZEPHCORE_MAX_TX_POWER_DBM=22

# Flash size — 8MB (override Zephyr default)
# CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y
